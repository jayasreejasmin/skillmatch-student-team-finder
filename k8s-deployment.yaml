apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillmatch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillmatch
  template:
    metadata:
      labels:
        app: skillmatch
    spec:
      containers:
        - name: skillmatch
          image: skillmatch-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: skillmatch-service
spec:
  type: NodePort
  selector:
    app: skillmatch
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080